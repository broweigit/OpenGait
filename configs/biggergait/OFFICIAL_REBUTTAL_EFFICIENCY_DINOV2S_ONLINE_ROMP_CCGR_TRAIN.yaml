# End-to-end lightweight PuppetGait: frozen DINOv2-S + online ROMP/SMPL.
# ROMP executes inside every forward; this config reads RGB only, never geometry pkl.
data_cfg:
  dataset_name: CCGR-MINI
  dataset_root: /data1/CCGR/CCGR_MINI_RGB_CUT/CCGR-MINI-RGB-V1/
  dataset_partition: ./datasets/CCGR-MINI/CCGR-MINI.json
  data_in_use: [true]
  num_workers: 8
  remove_no_gallery: false
  test_dataset_name: CCGR-MINI

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 30000
  save_name: OFFICIAL_REBUTTAL_EFFICIENCY_DINOV2S_ONLINE_ROMP_CCGR
  eval_func: evaluate_CCGR_MINI_part_based
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered
    frames_all_limit: 250
    type: InferenceSampler
  metric: euc
  transform:
    - type: BaseRgbTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: BiggerGait__DINOv2__Projection_Mask_OT_Based_SparseTopK4_OnlineROMP_Gaitbase_Share
  pretrained_lvm: ./pretrained_LVMs/dinov2-small
  # Parent constructor field only; the overridden initializer never loads SAM3D.
  pretrained_sam3d_root: ONLINE_ROMP_NO_SAM3D_LOAD
  require_full_sam_decoder: false
  romp_home: ~/.romp
  romp_target_h: 512
  romp_target_w: 256
  romp_focal_scale: 0.866015625
  romp_missing_policy: blank
  romp_hip_indices: [1, 2]
  romp_require_verts_camed_org: true
  image_size: 224
  sils_size: 32
  source_dim: 384
  num_unknown: 16
  total_layer_num: 12
  group_layer_num: 2
  head_num: 2
  num_FPN: 6
  chunk_size: 32
  gradient_checkpointing: false
  sync_hflip_prob: 0.0
  enable_timing: true
  ot_temperature: 0.01
  ot_dist_thresh: 0.2
  ot_iters: 8
  ot_topk_support: 4
  ot_sparse_rebalance_iters: 4
  branch_configs:
    - use_apose: false
      yaw: original
    - use_apose: false
      yaw: 0.0
  backbone_cfg:
    type: ResNet9
    block: BasicBlock
    in_channel: 16
    channels: [64, 128, 256, 512]
    layers: [1, 1, 1, 1]
    strides: [1, 2, 1, 1]
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 32
  SeparateBNNecks:
    class_num: 571
    in_channels: 256
    parts_num: 32
  bin_num: [32]

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: [15000, 25000]
  scheduler: MultiStepLR

trainer_cfg:
  find_unused_parameters: true
  enable_float16: true
  fix_BN: false
  log_iter: 100
  with_test: true
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 30000
  save_name: OFFICIAL_REBUTTAL_EFFICIENCY_DINOV2S_ONLINE_ROMP_CCGR
  sync_BN: true
  total_iter: 30000
  sampler:
    batch_shuffle: true
    batch_size: [8, 4]
    frames_num_fixed: 30
    frames_skip_num: 4
    frames_num_max: 40
    frames_num_min: 20
    sample_type: fixed_unordered
    type: TripletSampler
  transform:
    - type: BaseRgbTransform
