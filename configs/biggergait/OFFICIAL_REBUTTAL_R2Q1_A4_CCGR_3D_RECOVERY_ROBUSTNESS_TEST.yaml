# Reviewer 2 / Q1: A4 mesh-recovery robustness on CCGR-MINI.
# One dataloader traversal reports clean plus eight controlled conditions.
# Internally each condition must run A4 forward separately; this avoids eight
# independent data-loading/evaluator launches but is about 10x a clean test
# because temporal mean needs one additional MHR-parameter collection pass.
data_cfg:
  dataset_name: CCGR-MINI
  dataset_root: /data1/CCGR/CCGR_MINI_RGB_CUT/CCGR-MINI-RGB-V1/
  dataset_partition: ./datasets/CCGR-MINI/CCGR-MINI.json
  data_in_use: [true]
  num_workers: 8
  remove_no_gallery: false
  test_dataset_name: CCGR-MINI
  # Reproducible 1,050-sequence subset: 150 complete identities, retaining
  # two official gallery sequences and five view-balanced probes per identity.
  eval_subset:
    enabled: true
    seed: 7890
    num_pids: 150
    min_sequences_per_pid: 48
    gallery_per_pid: 2
    probes_per_pid: 5
    probe_views: ["0", "22_5", "45", "67_5", "90", "112_5", "135", "157_5", "180", "over"]

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: output/CCGR-MINI/BiggerGait__SAM3DBody__Projection_Mask_OT_Based_SparseTopK4_Gaitbase_Share/OFFICIAL_REBUTTAL_T2A4_T2B2_T2C3_T2D4_MAIN_CCGR/checkpoints/OFFICIAL_REBUTTAL_T2A4_T2B2_T2C3_T2D4_MAIN_CCGR-30000.pt
  # Keep robustness logs separate while explicitly restoring the A4 weight.
  save_name: OFFICIAL_REBUTTAL_R2Q1_A4_CCGR_3D_RECOVERY_ROBUSTNESS
  eval_func: evaluate_robustness_variants
  base_eval_func: evaluate_CCGR_MINI
  variants:
    - clean
    - lowres_x2
    - lowres_x4
    - occlusion_40pct
    - occlusion_60pct
    - occlusion_80pct
    - pose_jitter_5deg
    - pose_jitter_10deg
    - temporal_parameter_mean
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered
    frames_all_limit: 250
    type: InferenceSampler
  metric: euc
  transform:
    - type: BaseRgbTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: BiggerGait__SAM3DBody__Projection_Mask_OT_Based_SparseTopK4_Gaitbase_Share
  chunk_size: 8
  pretrained_lvm: pretrained_LVMs/sam-3d-body
  pretrained_mask_branch: BYPASS
  image_size: 256
  sils_size: 32
  source_dim: 1280
  num_FPN: 4
  debug_pca_vis: false
  robustness_eval:
    enabled: true
    # Relative to the fixed 512x256 SAM3D/LVM input.
    lowres_scales: [0.5, 0.25]
    # Central horizontal black bands on the normalized person crop.
    occlusion_fractions: [0.4, 0.6, 0.8]
    # Per-frame Gaussian std on MHR global/body rotation parameters; the two
    # levels share noise directions. Shape/camera/translation are not perturbed.
    pose_jitter_degrees: [5.0, 10.0]
    # Average recovered MHR parameters across the whole sequence before mesh
    # reconstruction (circular mean for rotation parameters).
    temporal_parameter_mean: true
    # Diagnostic only: count a catastrophic projection/recovery failure when
    # fewer than 10% of recovered vertices are finite, in front, and in-frame.
    mesh_failure_min_in_frame_ratio: 0.1
    seed: 7890
  layer_config:
    hook_mask:
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
    hook_sample_type: chunk
  num_unknown: 16
  ot_temperature: 0.01
  ot_dist_thresh: 0.2
  ot_iters: 8
  ot_topk_support: 4
  ot_sparse_rebalance_iters: 4
  branch_configs:
    - use_apose: false
      yaw: original
    - use_apose: true
      yaw: 0.0
  Mask_Branch:
    source_dim: 1280
    target_dim: 2
    p: 0.0
    softmax: true
    Relu: false
    Up: true
  backbone_cfg:
    type: ResNet9
    block: BasicBlock_Time
    in_channel: 16
    channels: [64, 128, 256, 512]
    layers: [1, 1, 1, 1]
    strides: [1, 2, 1, 1]
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 32
  SeparateBNNecks:
    class_num: 571
    in_channels: 256
    parts_num: 32
  bin_num: [32]

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: [15000, 25000]
  scheduler: MultiStepLR

trainer_cfg:
  find_unused_parameters: true
  enable_float16: true
  fix_BN: false
  log_iter: 100
  with_test: true
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 30000
  save_name: OFFICIAL_REBUTTAL_R2Q1_A4_CCGR_3D_RECOVERY_ROBUSTNESS
  sync_BN: true
  total_iter: 30000
  sampler:
    batch_shuffle: true
    batch_size: [8, 4]
    frames_num_fixed: 30
    frames_skip_num: 4
    frames_num_max: 40
    frames_num_min: 20
    sample_type: fixed_unordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomHorizontalFlip
        - type: BaseRgbTransform
