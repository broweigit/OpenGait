# A3/no-canonical control for the A4 CCGR robustness experiment.
# Uses exactly the same 150 identities and 1,050 sequences as the A4 test.
# One dataloader traversal reports the paired clean, 40%, 60%, and 80%
# central-horizontal-occlusion results; no retraining is performed.
data_cfg:
  dataset_name: CCGR-MINI
  dataset_root: /data1/CCGR/CCGR_MINI_RGB_CUT/CCGR-MINI-RGB-V1/
  dataset_partition: ./datasets/CCGR-MINI/CCGR-MINI.json
  data_in_use: [true]
  num_workers: 8
  remove_no_gallery: false
  test_dataset_name: CCGR-MINI
  eval_subset:
    enabled: true
    seed: 7890
    num_pids: 150
    min_sequences_per_pid: 48
    gallery_per_pid: 2
    probes_per_pid: 5
    probe_views: ["0", "22_5", "45", "67_5", "90", "112_5", "135", "157_5", "180", "over"]

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: output/CCGR-MINI/BiggerGait__SAM3DBody__Projection_Mask_Gaitbase_Share/OFFICIAL_REBUTTAL_T2A3_T2D1_SAM3D_NO_LAYOUT_CCGR/checkpoints/OFFICIAL_REBUTTAL_T2A3_T2D1_SAM3D_NO_LAYOUT_CCGR-30000.pt
  save_name: OFFICIAL_REBUTTAL_R2Q1_A3_CCGR_OCCLUSION_CONTROL
  eval_func: evaluate_embedding_variants
  base_eval_func: evaluate_CCGR_MINI
  result_group: robustness
  variants:
    - clean
    - occlusion_40pct
    - occlusion_60pct
    - occlusion_80pct
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered
    frames_all_limit: 250
    type: InferenceSampler
  metric: euc
  transform:
    - type: BaseRgbTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: BiggerGait__SAM3DBody__Projection_Mask_OcclusionEval_Gaitbase_Share
  chunk_size: 8
  pretrained_lvm: pretrained_LVMs/sam-3d-body
  pretrained_mask_branch: BYPASS
  image_size: 256
  sils_size: 32
  source_dim: 1280
  num_FPN: 4
  occlusion_eval:
    enabled: true
    occlusion_fractions: [0.4, 0.6, 0.8]
  layer_config:
    hook_mask:
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
    hook_sample_type: chunk
  num_unknown: 16
  Mask_Branch:
    source_dim: 1280
    target_dim: 2
    p: 0.0
    softmax: true
    Relu: false
    Up: true
  backbone_cfg:
    type: ResNet9
    block: BasicBlock_Time
    in_channel: 16
    channels: [64, 128, 256, 512]
    layers: [1, 1, 1, 1]
    strides: [1, 2, 1, 1]
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 32
  SeparateBNNecks:
    class_num: 571
    in_channels: 256
    parts_num: 32
  bin_num: [32]

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: [15000, 25000]
  scheduler: MultiStepLR

trainer_cfg:
  find_unused_parameters: true
  enable_float16: true
  fix_BN: false
  log_iter: 100
  with_test: true
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 30000
  save_name: OFFICIAL_REBUTTAL_R2Q1_A3_CCGR_OCCLUSION_CONTROL
  sync_BN: true
  total_iter: 30000
  sampler:
    batch_shuffle: true
    batch_size: [8, 4]
    frames_num_fixed: 30
    frames_skip_num: 4
    frames_num_max: 40
    frames_num_min: 20
    sample_type: fixed_unordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomHorizontalFlip
        - type: BaseRgbTransform
