# Export train-ID RGB-only student/base features after training. Run with --phase test.
data_cfg:
  dataset_name: CCGR3D
  dataset_root: /data4/CCGR_3D/RGB
  dataset_partition: ./datasets/CCGR3D/CCGR3D_train_as_test.json
  data_in_use: [true]
  num_workers: 8
  cache: false
  remove_no_gallery: false
  test_dataset_name: CCGR3D
evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 30000
  save_name: BIGGERGAIT_CCGR3D_DINOV2S_BASE
  eval_func: cache_CCGR3D_features
  cache_path: ./output/CCGR3D/feature_cache/student_train.npz
  skip_ddp: true
  rank0_only_accumulation: true
  sampler: {batch_shuffle: false, batch_size: 8, sample_type: all_ordered, frames_all_limit: 250, type: InferenceSampler}
  transform: [{type: BaseRgbTransform}]
loss_cfg:
  - {type: TripletLoss, log_prefix: triplet, margin: 0.2, loss_term_weight: 1.0}
  - {type: CrossEntropyLoss, log_prefix: softmax, scale: 16, loss_term_weight: 1.0}
model_cfg:
  model: BiggerGaitCCGR3DStudent
  export_cache_only: true
  pretrained_lvm: ./pretrained_LVMs/dinov2-small
  pretrained_mask_branch: ./pretrained_LVMs/CCGR3D_MaskBranch_vits14.pt
  image_size: 224
  sils_size: 32
  source_dim: 384
  num_unknown: 16
  total_layer_num: 12
  group_layer_num: 2
  head_num: 2
  num_FPN: 6
  chunk_size: 96
  Mask_Branch: {source_dim: 384, target_dim: 2, p: 0.0, softmax: false}
  backbone_cfg: {type: ResNet9, block: BasicBlock, in_channel: 16, channels: [64, 128, 256, 512], layers: [1, 1, 1, 1], strides: [1, 2, 1, 1], maxpool: false}
  SeparateFCs: {in_channels: 512, out_channels: 256, parts_num: 32}
  SeparateBNNecks: {class_num: 115, in_channels: 256, parts_num: 32}
  bin_num: [32]
optimizer_cfg: {lr: 0.1, momentum: 0.9, solver: SGD, weight_decay: 0.0005}
scheduler_cfg: {scheduler: MultiStepLR, gamma: 0.1, milestones: [15000, 25000]}
trainer_cfg:
  find_unused_parameters: true
  enable_float16: true
  fix_BN: false
  log_iter: 100
  with_test: false
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 10000
  save_name: BIGGERGAIT_CCGR3D_DINOV2S_BASE
  sync_BN: true
  total_iter: 30000
  sampler: {batch_shuffle: true, batch_size: [8, 4], frames_num_fixed: 30, frames_skip_num: 4, frames_num_max: 40, frames_num_min: 20, sample_type: fixed_unordered, type: TripletSampler}
  transform: [{type: BaseRgbTransform}]
