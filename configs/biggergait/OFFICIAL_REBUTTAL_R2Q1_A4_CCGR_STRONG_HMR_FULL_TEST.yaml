# PDF full method: SAM3D appearance/geometry, original + A-pose yaw-0, SparseTopK4.
# dataset_name deliberately remains CCGR-MINI for checkpoint lookup.
data_cfg:
  dataset_name: CCGR-MINI
  dataset_root: /data1/CCGR/CCGR_MINI_RGB_CUT/CCGR-MINI-RGB-V1/
  dataset_partition: ./datasets/CCGR-MINI/CCGR-MINI.json
  data_in_use: [true]
  num_workers: 8
  remove_no_gallery: false
  test_dataset_name: CCGR-MINI

evaluator_cfg:
  enable_float16: true
  skip_ddp: true
  # Eleven full-size embeddings over 20,377 sequences would otherwise be
  # retained independently by every rank (~440 GiB across eight ranks).
  # All ranks still gather each batch; only rank 0 keeps the gathered arrays.
  rank0_only_accumulation: true
  restore_ckpt_strict: true
  restore_hint: output/CCGR-MINI/BiggerGait__SAM3DBody__Projection_Mask_OT_Based_SparseTopK4_Gaitbase_Share/OFFICIAL_REBUTTAL_T2A4_T2B2_T2C3_T2D4_MAIN_CCGR/checkpoints/OFFICIAL_REBUTTAL_T2A4_T2B2_T2C3_T2D4_MAIN_CCGR-30000.pt
  save_name: OFFICIAL_REBUTTAL_R2Q1_A4_CCGR_STRONG_HMR_FULL_TEST
  eval_func: evaluate_strong_hmr_robustness
  base_eval_func: evaluate_CCGR_MINI
  variants:
    - clean
    - joint_max_15deg
    - joint_max_30deg
    - joint_max_45deg
    - shape_std_0p5
    - shape_std_1
    - projection_scale_0p75
    - projection_scale_1p25
    - global_orientation_max_15deg
    - global_orientation_max_30deg
    - global_orientation_max_45deg
  sampler:
    batch_shuffle: false
    batch_size: 8
    sample_type: all_ordered
    frames_all_limit: -1
    type: InferenceSampler
  metric: euc
  transform:
    - type: BaseRgbTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: BiggerGait__SAM3DBody__Projection_Mask_OT_Based_SparseTopK4_StrongHMRRobustness_Gaitbase_Share
  chunk_size: 64
  pretrained_lvm: pretrained_LVMs/sam-3d-body
  pretrained_mask_branch: BYPASS
  image_size: 256
  sils_size: 32
  source_dim: 1280
  num_FPN: 4
  debug_pca_vis: false
  strong_hmr_robustness_eval:
    enabled: true
    # Run three geometry variants together, but cap only the quadratic OT
    # stage at 8 frames. The frozen LVM and HMR decoder still use chunk_size 64.
    variant_microbatch_size: 3
    canonical_frame_chunk_size: 8
    joint_max_degrees: [15.0, 30.0, 45.0]
    shape_noise_stds: [0.5, 1.0]
    projection_scales: [0.75, 1.25]
    global_orientation_max_degrees: [15.0, 30.0, 45.0]
    seed: 7890
  layer_config:
    hook_mask:
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
    hook_sample_type: chunk
  num_unknown: 16
  ot_temperature: 0.01
  ot_dist_thresh: 0.2
  ot_iters: 8
  ot_topk_support: 4
  ot_sparse_rebalance_iters: 4
  branch_configs:
    - use_apose: false
      yaw: original
    - use_apose: true
      yaw: 0.0
  Mask_Branch:
    source_dim: 1280
    target_dim: 2
    p: 0.0
    softmax: true
    Relu: false
    Up: true
  backbone_cfg:
    type: ResNet9
    block: BasicBlock_Time
    in_channel: 16
    channels: [64, 128, 256, 512]
    layers: [1, 1, 1, 1]
    strides: [1, 2, 1, 1]
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 32
  SeparateBNNecks:
    class_num: 571
    in_channels: 256
    parts_num: 32
  bin_num: [32]

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: [15000, 25000]
  scheduler: MultiStepLR

trainer_cfg:
  # Training-only fields below are ignored by --phase test; in particular,
  # frames_num_fixed: 30 does not truncate this all_ordered evaluation.
  find_unused_parameters: true
  enable_float16: true
  fix_BN: false
  log_iter: 100
  with_test: true
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 30000
  save_name: OFFICIAL_REBUTTAL_T2A4_T2B2_T2C3_T2D4_MAIN_CCGR
  sync_BN: true
  total_iter: 30000
  sampler:
    batch_shuffle: true
    batch_size: [8, 4]
    frames_num_fixed: 30
    frames_skip_num: 4
    frames_num_max: 40
    frames_num_min: 20
    sample_type: fixed_unordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomHorizontalFlip
        - type: BaseRgbTransform
