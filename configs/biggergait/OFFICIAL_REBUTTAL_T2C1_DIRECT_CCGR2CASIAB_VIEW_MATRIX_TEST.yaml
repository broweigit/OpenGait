# C1 Direct, trained on CCGR-MINI: complete CASIA-B 11x11 view evaluation.
# The evaluator reports NM/BG/CL Rank-1, mAP and mINP matrices, their overall
# cross-view values, and Small/Medium/Large view-gap Rank-1 summaries.
# dataset_name remains CCGR-MINI so the existing C1 checkpoint is found.
data_cfg:
  dataset_name: CCGR-MINI
  dataset_root: /data1/jdy/casiab/casiab-ratio-frompkl
  dataset_partition: ./datasets/CASIA-B/CASIA-B.json
  data_in_use: [true, false]
  num_workers: 8
  remove_no_gallery: false
  test_dataset_name: CASIA-B

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 30000
  save_name: OFFICIAL_REBUTTAL_T2C1_DIRECT_CCGR
  eval_func: evaluate_fixed_probe_view
  probe_view: "all"
  view_gap_thresholds: [36.0, 72.0]
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered
    frames_all_limit: 250
    type: InferenceSampler
  metric: euc
  transform:
    - type: BaseRgbTransform
      cutting: 0

model_cfg:
  model: BiggerGait__SAM3DBody__Projection_Mask_DirectRelocation_Gaitbase_Share
  chunk_size: 8
  pretrained_lvm: pretrained_LVMs/sam-3d-body
  pretrained_mask_branch: BYPASS
  image_size: 256
  sils_size: 32
  source_dim: 1280
  num_FPN: 4
  debug_pca_vis: false
  layer_config:
    hook_mask:
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - false
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
      - true
    hook_sample_type: chunk
  num_unknown: 16
  ot_temperature: 0.01
  ot_dist_thresh: 0.2
  ot_iters: 8
  ot_topk_support: 0
  ot_sparse_rebalance_iters: 4
  branch_configs:
    - use_apose: false
      yaw: original
    - use_apose: true
      yaw: 0.0
  Mask_Branch:
    source_dim: 1280
    target_dim: 2
    p: 0.0
    softmax: true
    Relu: false
    Up: true
  backbone_cfg:
    type: ResNet9
    block: BasicBlock_Time
    in_channel: 16
    channels: [64, 128, 256, 512]
    layers: [1, 1, 1, 1]
    strides: [1, 2, 1, 1]
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 32
  SeparateBNNecks:
    class_num: 571
    in_channels: 256
    parts_num: 32
  bin_num: [32]
